<!DOCTYPE html>
<html lang="en">
<head class="nav-header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemone</title>
    <link rel="icon" type="image/png/svg" href="assets/logo-web.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav-header">
        <nav class="navbar">
            <div class="nav-link">
                <div>ECOSISTEMA</div>
                <div>QUIENES SOMOS</div>
            </div>
            <a href="#" class="logo">
                <img src="assets/logo-web.svg" class="logo">
            </a>
            <div class="nav-link">
                <div>ASISTENTE IA</div>
                <div>PRODUCTOS</div>
            </div>
        </nav>
    </header>
    <main>
        <section class="card-section">
            <div class="card">
                <div class="card-content">
                    <h1 class="card-title">TU ESPACIO SEGURO.</h1>
                    <p class="card-subtitle">TU CONTENCIÓN ES PRIMERO.</p>
                    <button class="card-button">COMENZAR.</button>
                </div>
                <div class="card-img-content">
                    <img src="assets/img-card.png" class="card-img">
                </div>
            </div>
        </section>
        <section class="toolbar-section">
            <div class="toolbar-card">
                <button class="icon-tool">
                    <img src="assets/home.png" alt="Home">
                </button>
                <div class="search-box">
                    <img src="assets/search.png" alt="Search" class="search-icon">
                    <input type="text" placeholder="" class="search-input">
                </div>
                <div class="toolbar-right">
                    <button class="icon-tool"><img src="assets/user.png" alt="User"></button>
                    <button class="icon-tool"><img src="assets/info.png" alt="Info"></button>
                    <button class="icon-tool"><img src="assets/help.png" alt="Help"></button>
                    <button class="icon-tool"><img src="assets/menu.png" alt="Menú"></button>
                </div>
            </div>
        </section>
        <section>
            <p class="slogan">TECHNOLOGY EMOTIONAL WELLBEGIN.</p>
        </section>

        <section class="video-section">
    <div class="video-card">
        <div class="video-container">
            <video id="anemone-video" poster="assets/3545.png" muted loop>
                <source src="assets/video-final.mp4" type="video/mp4">
            </video>
        </div>
        <div class="controls-video">
            <button class="v-icons" id="btn-play"><img src="assets/play.png" alt="play"></button>
            <button class="v-icons" id="btn-pause"><img src="assets/pause.png" alt="pause"></button>
            <button class="v-icons" id="btn-next"><img src="assets/next.png" alt="next"></button>
            <button class="v-icons" id="btn-prev"><img src="assets/preview.png" alt="preview"></button>
            <button class="v-icons" id="btn-share"><img src="assets/share.png" alt="share"></button>
            <button class="v-icons icon-muted" id="btn-mute"><img src="assets/down.png" alt="mute"></button>
            <button class="v-icons icon-volume isHidden" id="act-btn"><img src="assets/up.png" alt="act-volum"></button>
        </div>
    </div> 
</section>

        <section class="app-section">
            <button class="app-download-btn">DESCARGAR APP</button>
            <div class="phone-mockup">
                <img src="assets/cel.png" alt="App Preview" class="phone-img">
            </div>
        </section>
        <section class="therapists-section">
            <div class="therapists-card">
                <div class="avatars-group">
                    <img src="assets/therapist1.png" alt="Terapeuta 1" class="therapists-img">
                    <img src="assets/therapist2.png" alt="Terapeuta 2" class="therapists-img">
                    <img src="assets/therapist3.png" alt="Terapeuta 3" class="therapists-img">
                </div>
                <div class="therapists-info">
                    <h3>Contención real supervisada.</h3>
                    <p>Por terapeutas a través de nuestra IA.</p>
                </div>
            </div>
        </section>
        <footer class="footer-section">
            <div class="footer-card">
                <div class="footer-links">
                    <a href="#" class="f-link">TÉRMINOS Y CONDICIONES</a>
                    <a href="#" class="f-link">PRIVACIDAD</a>
                    <a href="#" class="f-link">CONTACTO</a>
                </div>
                <div class="footer-copy">
                    <p>© 2026 ANEMONE. TECH EMOTIONAL WELLBEING.</p>
                </div>
            </div>
        </footer>
    </main>
    <script src="main.js"></script>
</body>
</html>
